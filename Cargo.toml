[package]
name = "ieum"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "한국어 문장으로 읽히는 프로그래밍 언어 이음"
publish = false

[dependencies]
foldhash = "=0.1.5"
jiff = "=0.2.15"
lsp-server = "=0.10.0"
lsp-types = "=0.97.0"
mimalloc = { version = "=0.1.52", default-features = false }
num-bigint = "=0.4.8"
num-integer = "=0.1.46"
num-traits = "=0.2.19"
regex = "=1.12.3"
serde = "=1.0.229"
serde_json = "=1.0.151"
unicode-ident = "=1.0.12"
unicode-normalization = "=0.1.23"
unicode-width = "=0.2.2"
ureq = "=3.4.2"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = true
codegen-units = 1
